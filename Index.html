<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Silva & Vitrum | Shop</title>
  <meta name="description" content="Artisanal glass and wood decor.">
  <meta name="keywords" content="Silva and Vitrum, glass decor, wood art">

  <style>
    * { box-sizing: border-box; scroll-behavior: smooth; }
    body { background: #fdfdfd; color: #1a1a1a; font-family: "Georgia", serif; margin: 0; }
    nav { padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; background: white; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #eee; }
    .logo { letter-spacing: 5px; font-weight: bold; font-size: 18px; cursor: pointer; }
    .nav-links span { font-size: 10px; letter-spacing: 2px; margin-left: 20px; cursor: pointer; text-transform: uppercase; color: #555; }
    .view-section { display: none; animation: fadeIn 0.4s ease; }
    .active { display: block; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .hero { height: 25vh; background: #f8f8f8; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    .filter-bar { text-align: center; padding: 20px 0; background: #fff; border-bottom: 1px solid #f9f9f9; }
    .f-btn { background: none; border: 1px solid #eee; padding: 8px 18px; font-size: 10px; border-radius: 20px; margin: 0 5px; cursor: pointer; }
    .f-btn.active { background: #1a1a1a; color: white; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; max-width: 1000px; margin: 0 auto; }
    .card { border: 1px solid #f2f2f2; padding-bottom: 15px; text-align: center; background: white; cursor: pointer; }
    .img-box { height: 180px; background: #f4f4f4; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 10px; }
    .item-name { font-size: 14px; margin: 10px 0 5px 0; }
    .price { color: #8b5e3c; font-size: 12px; font-weight: bold; }
    .desc-content { max-width: 600px; margin: 0 auto; padding: 40px 20px; }
    .add-cart-btn { background: #1a1a1a; color: white; border: none; padding: 18px; width: 100%; cursor: pointer; letter-spacing: 2px; text-transform: uppercase; }
    .checkout-box { max-width: 400px; margin: 40px auto; padding: 30px; border: 1px solid #eee; text-align: center; }
    .pay-btn { display: block; width: 100%; padding: 15px; margin-bottom: 10px; border: 1px solid #ddd; background: white; cursor: pointer; }
    
    /* Shared style for half-width centered back buttons */
    .back-btn {
      display: block;
      width: 50%;
      margin: 25px auto 0 auto;
      padding: 12px 0;
      background: #f4f4f4;
      color: #333;
      border: 1px solid #ddd;
      text-align: center;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .back-btn:hover { background: #e8e8e8; }
  </style>
</head>
<body>

<nav>
  <div class="logo" onclick="showView('home-view')">SILVA</div>
  <div class="nav-links">
    <span onclick="showView('home-view')">SHOP</span>
    <span onclick="showView('about-view')">ABOUT</span>
  </div>
</nav>

<div id="home-view" class="view-section active">
  <header class="hero"><h1>Silva & Vitrum</h1><p style="letter-spacing:3px; font-size:10px; color:#aaa;">WOOD & GLASS</p></header>
  <div class="filter-bar">
    <button class="f-btn active" onclick="filterItems('ALL', this)">ALL</button>
    <button class="f-btn" onclick="filterItems('GLASS', this)">GLASS</button>
    <button class="f-btn" onclick="filterItems('WOOD', this)">WOOD</button>
  </div>
  <div class="grid" id="product-grid"></div>
  <button class="back-btn" onclick="history.back()">← Back</button>
</div>

<div id="desc-view" class="view-section">
  <div class="desc-content">
    <div style="width:100%; height:250px; background:#f4f4f4; margin-bottom:20px;"></div>
    <h1 id="d-title" style="font-style:italic; margin: 0 0 10px 0;"></h1>
    <p id="d-price" style="font-weight:bold; color:#8b5e3c; margin: 0 0 15px 0;"></p>
    <p id="d-text" style="line-height:1.6; color:#444; margin-bottom: 25px;"></p>
    <button class="add-cart-btn" onclick="showView('checkout-view')">BUY</button>
    <button class="back-btn" onclick="showView('home-view')">← Back</button>
  </div>
</div>

<div id="checkout-view" class="view-section">
  <div class="checkout-box">
    <h2 style="font-style:italic;">Pay</h2>
    <button class="pay-btn" onclick="alert('Card Selected')">CARD</button>
    <button class="pay-btn" onclick="alert('Apple Pay Selected')">APPLE PAY</button>
    <button class="pay-btn" onclick="alert('Crypto Selected')">CRYPTO</button>
    <button class="back-btn" onclick="showView('home-view')">← Back</button>
  </div>
</div>

<div id="about-view" class="view-section">
  <div style="padding: 60px 10%; text-align: center; max-width: 600px; margin: 0 auto;">
    <h2 style="font-style:italic;">About</h2>
    <p style="color: #555; line-height: 1.6;">Handcrafted wood and blown glass pieces.</p>
    <button class="back-btn" onclick="showView('home-view')">← Back</button>
  </div>
</div>

<script>
  const products = [
    { name: "Aurora Vase", type: "GLASS", price: "$180", desc: "Hand-blown smoked glass." },
    { name: "Heritage Bowl", type: "WOOD", price: "$240", desc: "Carved walnut wood." },
    { name: "Lumina Carafe", type: "GLASS", price: "$120", desc: "Fluted crystal." },
    { name: "Sculpt Tray", type: "WOOD", price: "$95", desc: "Satin-finish white oak." },
    { name: "Solis Sphere", type: "GLASS", price: "$210", desc: "Amber glass vessel." },
    { name: "Apex Platter", type: "WOOD", price: "$135", desc: "Reclaimed teak wood." },
    { name: "Nordic Pitcher", type: "GLASS", price: "$110", desc: "Recycled thick glass." },
    { name: "Pillar Stand", type: "WOOD", price: "$80", desc: "Ebonized ash wood." },
    { name: "Prism Vessel", type: "GLASS", price: "$290", desc: "Geometric cut crystal." },
    { name: "Basin Board", type: "WOOD", price: "$155", desc: "Solid acacia wood." }
  ];

  function renderGrid(filter = 'ALL') {
    const grid = document.getElementById('product-grid');
    grid.innerHTML = '';
    products.filter(p => filter === 'ALL' || p.type === filter).forEach(p => {
      grid.innerHTML += `
        <div class="card" onclick="openDesc('${p.name}', '${p.price}', '${p.desc}')">
          <div class="img-box">${p.type}</div>
          <div class="item-name">${p.name}</div>
          <div class="price">${p.price}</div>
        </div>`;
    });
  }

  function filterItems(type, btn) {
    document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGrid(type);
  }

  function showView(viewId) {
    document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
    window.scrollTo(0,0);
  }

  function openDesc(name, price, text) {
    document.getElementById('d-title').innerText = name;
    document.getElementById('d-price').innerText = price;
    document.getElementById('d-text').innerText = text;
    showView('desc-view');
  }

  renderGrid();
</script>
</body>
</html>
