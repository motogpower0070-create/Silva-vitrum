<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silva-Vitrum | Premium Suites</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap');

        :root { --white: #ffffff; --black: #111111; --gold: #ae944f; --pkr-green: #006633; --sale-red: #bf1e2e; }
        body { font-family: 'Montserrat', sans-serif; margin: 0; background: var(--white); color: var(--black); overflow-x: hidden; }

        /* Navigation */
        .cart-status { background: var(--black); color: white; padding: 12px; text-align: center; position: sticky; top: 0; z-index: 5000; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; }
        header { background: white; padding: 1.5rem; text-align: center; border-bottom: 1px solid #eee; position: relative; z-index: 4000; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.8rem; letter-spacing: 3px; font-weight: 700; cursor: pointer; }

        /* Fixed Hamburger Menu */
        .ham { cursor: pointer; position: absolute; left: 20px; top: 50%; transform: translateY(-50%); width: 25px; height: 18px; display: flex; flex-direction: column; justify-content: space-between; z-index: 5500; }
        .ham span { display: block; height: 2px; width: 100%; background: black; transition: 0.3s; }

        .sidebar { position: fixed; left: -100%; top: 0; width: 280px; height: 100%; background: white; z-index: 5200; transition: 0.4s ease-in-out; border-right: 1px solid #eee; padding-top: 100px; box-shadow: 10px 0 20px rgba(0,0,0,0.05); }
        .sidebar.active { left: 0; }
        .sidebar a { display: block; padding: 20px 25px; text-decoration: none; color: black; font-size: 0.75rem; border-bottom: 1px solid #f9f9f9; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }

        /* Splash Page */
        #splash { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: white; z-index: 9000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.6s; }
        #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
        .cta-box { border-top: 1px solid #eee; border-bottom: 1px solid #eee; padding: 40px 0; width: 100%; text-align: center; cursor: pointer; }
        .cta-btn { background: none; border: none; font-size: 0.9rem; font-weight: 600; text-transform: uppercase; letter-spacing: 5px; cursor: pointer; }

        /* Grid & Cards */
        .page { display: none; padding: 20px; max-width: 1100px; margin: auto; animation: fadeIn 0.4s; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { text-align: center; cursor: pointer; margin-bottom: 20px; padding: 15px 10px 20px; border: 1px solid #eee; background: #fafafa; display: flex; flex-direction: column; justify-content: flex-start; min-height: 160px; }
        .product-name-heading { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; color: var(--black); }
        .price-tag { font-size: 0.85rem; font-weight: 600; color: var(--pkr-green); }
        .old-price { color: var(--sale-red); text-decoration: line-through; font-size: 0.7rem; margin-right: 5px; }

        /* Product picture area (built with simple line icons, not photos) */
        .product-picture { width: 100%; height: 90px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; border-radius: 4px; }
        .product-picture svg { width: 56px; height: 56px; }
        .product-picture.small { height: 60px; margin-bottom: 8px; }
        .product-picture.small svg { width: 36px; height: 36px; }
        .product-picture.large { height: 190px; margin-bottom: 0; }
        .product-picture.large svg { width: 100px; height: 100px; }

        /* Navigation Buttons */
        .back-nav { display: block; margin-bottom: 20px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: #888; cursor: pointer; border: none; background: none; padding: 0; text-align: left; }
        .back-nav:hover { color: var(--black); }

        /* UI Buttons */
        .primary-btn { background: var(--black); color: white; border: none; padding: 18px; width: 100%; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; margin-top: 10px; }
        .secondary-btn { background: #eee; color: black; border: none; padding: 18px; width: 100%; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; cursor: pointer; margin-top: 10px; }
        .clear-btn { background: #fff; color: var(--sale-red); border: 1px solid var(--sale-red); padding: 10px; width: 100%; font-size: 0.65rem; font-weight: 600; text-transform: uppercase; cursor: pointer; margin-top: 10px; }

        input, select { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #ddd; font-family: 'Montserrat'; font-size: 0.9rem; box-sizing: border-box; }
        .sec-title { font-family: 'Playfair Display'; text-align: center; font-size: 1.5rem; margin-bottom: 30px; }
    </style>
</head>
<body>

<div id="splash">
    <div class="cta-box" onclick="closeWelcomeScreen()">
        <button class="cta-btn">→ WHAT ARE U WAITING FOR?</button>
    </div>
</div>

<div class="cart-status" id="cart-text">CART: 0 ITEMS | RS. 0</div>

<header>
    <div class="ham" onclick="toggleSideMenu()">
        <span></span><span></span><span></span>
    </div>
    <div class="logo" onclick="showPage('home')">Silva-Vitrum</div>
</header>

<div class="sidebar" id="sidebar">
    <a onclick="filterByCategory('All')">All Collections</a>
    <a onclick="filterByCategory('Bedroom')">Bedroom Suites</a>
    <a onclick="filterByCategory('Kitchen')">Kitchen Suites</a>
    <a onclick="filterByCategory('Seasonal')">Seasonal</a>
    <a onclick="filterByCategory('Discounted')">30% Off Sale</a>
    <a onclick="showPage('checkout')">My Checkout</a>
</div>

<div id="home" class="page active">
    <h2 class="sec-title">Artisan Suite</h2>
    <div class="grid" id="main-grid"></div>
</div>

<div id="details" class="page">
    <button class="back-nav" onclick="goBack()">← Back</button>
    <div id="detail-content"></div>
</div>

<div id="suggestions" class="page">
    <button class="back-nav" onclick="goBack()">← Back</button>
    <h2 class="sec-title">Shop More</h2>
    <p style="text-align:center; font-size:0.8rem; margin-bottom:20px;">Add these matching items to your cart:</p>
    <div class="grid" id="suggest-grid"></div>
    <div style="margin-top:30px;">
        <button class="primary-btn" onclick="showPage('checkout')">BUY NOW</button>
        <button class="secondary-btn" onclick="goBack()">BACK</button>
    </div>
</div>

<div id="checkout" class="page">
    <button class="back-nav" onclick="goBack()">← Back</button>
    <h2 class="sec-title">Checkout Details</h2>
    <div id="final-summary" style="padding:15px; background:#f9f9f9; margin-bottom:20px; font-size:0.8rem;"></div>

    <button class="clear-btn" onclick="clearCart()">Clear Cart & Restart</button>
    <hr style="border:0; border-top:1px solid #eee; margin:20px 0;">

    <input type="text" placeholder="Your Full Name">
    <input type="text" placeholder="Shipping Address & City">
    <input type="tel" placeholder="WhatsApp Phone Number">
    <input type="email" placeholder="Email Address">
    <select>
        <option disabled selected>Payment Method</option>
        <option>Bank Transfer (HBL/UBL)</option>
        <option>EasyPaisa / JazzCash</option>
        <option>Cash on Delivery</option>
    </select>
    <button class="primary-btn" onclick="alert('Order Sent! Our team will contact you on WhatsApp.'); location.reload();">COMPLETE ORDER</button>
</div>

<script>
    // ---- Shopping cart (the list of items the shopper wants to buy) ----
    let cart = [];

    // ---- Screen history (so the Back button knows where you came from) ----
    let currentPage = 'home';
    let pageHistory = [];

    // ---- All products for sale. "picture" tells us which icon to draw. ----
    const products = [
        { id: 1, category: 'Bedroom', name: 'Royal haven bedroom suite', price: 180000, picture: 'bed' },
        { id: 2, category: 'Bedroom', name: 'Midnight Luxe bedroom collection', price: 210000, picture: 'bed' },
        { id: 3, category: 'Bedroom', name: 'Serene oak retreat bedroom set', price: 165000, picture: 'bed' },
        { id: 4, category: 'Kitchen', name: 'Golden crest kitchen suite', price: 120000, picture: 'cabinet' },
        { id: 5, category: 'Kitchen', name: 'Urban Noir kitchen collection', price: 145000, picture: 'cabinet' },
        { id: 6, category: 'Kitchen', name: 'Pure Haven kitchen set', price: 110000, picture: 'cabinet' },
        { id: 7, category: 'Seasonal', name: 'Golden breeze collection', price: 55000, picture: 'breeze' },
        { id: 8, category: 'Seasonal', name: 'Frost haven collection', price: 65000, picture: 'snowflake' },
        { id: 9, category: 'Seasonal', name: 'Bloom aura collection', price: 48000, picture: 'flower' },
        { id: 10, category: 'Discounted', name: 'Bargain haven', price: 70000, sale: true, picture: 'tag' },
        { id: 11, category: 'Discounted', name: 'Deal depot', price: 56000, sale: true, picture: 'tag' },
        { id: 12, category: 'Discounted', name: 'Hot picks sale', price: 49000, sale: true, picture: 'tag' },
        { id: 13, category: 'Deals', name: 'Perfect pair deals', price: 250000, picture: 'gift' },
        { id: 14, category: 'Deals', name: 'Duo delight collection', price: 220000, picture: 'gift' },
        { id: 15, category: 'Deals', name: 'Twin treasure deals', price: 275000, picture: 'gift' }
    ];

    // ---- Simple line-drawing icons, used as stand-in pictures for each product. ----
    // Each one is plain shapes only (no photos), so the page never depends on
    // outside images or copyrighted photography, and still works offline.
    const iconShapes = {
        bed: '<path d="M18 62 L18 42 Q18 37 23 37 L77 37 Q82 37 82 42 L82 62"/><path d="M13 62 L13 74 M87 62 L87 74"/><rect x="22" y="46" width="22" height="10" rx="3"/><rect x="13" y="58" width="74" height="8" rx="2"/>',
        cabinet: '<rect x="24" y="20" width="52" height="60" rx="2"/><line x1="50" y1="20" x2="50" y2="80"/><circle cx="44" cy="50" r="2.5" fill="currentColor"/><circle cx="56" cy="50" r="2.5" fill="currentColor"/>',
        tag: '<path d="M28 28 L58 28 L74 46 L48 72 L22 46 Z"/><circle cx="37" cy="37" r="4.5"/>',
        gift: '<rect x="22" y="45" width="56" height="34" rx="2"/><line x1="22" y1="45" x2="78" y2="45"/><line x1="50" y1="45" x2="50" y2="79"/><path d="M50 45 C40 22 26 28 33 39 C39 48 50 45 50 45 C50 45 61 48 67 39 C74 28 60 22 50 45 Z"/>',
        breeze: '<path d="M18 34 Q40 22 56 34 Q66 42 55 48" fill="none"/><path d="M14 50 Q46 38 68 50 Q78 58 66 65" fill="none"/><path d="M20 66 Q42 58 54 66" fill="none"/>',
        snowflake: '<line x1="50" y1="18" x2="50" y2="82"/><line x1="22" y1="34" x2="78" y2="66"/><line x1="22" y1="66" x2="78" y2="34"/><path d="M50 18 L44 26 M50 18 L56 26 M50 82 L44 74 M50 82 L56 74"/>',
        flower: '<circle cx="50" cy="34" r="9"/><circle cx="33" cy="56" r="9"/><circle cx="67" cy="56" r="9"/><circle cx="50" cy="70" r="9"/><circle cx="50" cy="52" r="6" fill="currentColor"/>'
    };

    // Each picture type gets its own accent color, matching the gold/black theme.
    const iconColors = {
        bed: '#ae944f',
        cabinet: '#8a5a2b',
        tag: '#bf1e2e',
        gift: '#8a7440',
        breeze: '#6b7a8f',
        snowflake: '#5b8fb0',
        flower: '#b5637a'
    };

    // Builds the little picture shown on a product card, using the icon shapes above.
    function buildProductPicture(product, sizeClass) {
        const color = iconColors[product.picture] || '#ae944f';
        const shape = iconShapes[product.picture] || iconShapes.tag;
        return `
            <div class="product-picture ${sizeClass || ''}" style="background:${color}1a;">
                <svg viewBox="0 0 100 100" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    ${shape}
                </svg>
            </div>`;
    }

    // Shows the product grid on the home page. If no list is given, shows everything.
    function displayProducts(list) {
        const itemsToShow = list || products;
        document.getElementById('main-grid').innerHTML = itemsToShow.map(product => {
            let priceText = `Rs. ${product.price.toLocaleString()}`;
            if (product.sale) {
                const originalPrice = Math.round(product.price / 0.7);
                priceText = `<span class="old-price">Rs.${originalPrice.toLocaleString()}</span> Rs.${product.price.toLocaleString()}`;
            }
            return `
            <div class="card" onclick="showProductDetails(${product.id})">
                ${buildProductPicture(product)}
                <div class="product-name-heading">${product.name}</div>
                <div class="price-tag">${priceText}</div>
            </div>`;
        }).join('');
    }

    // Shows the full detail page for one product.
    function showProductDetails(productId) {
        const product = products.find(item => item.id === productId);
        document.getElementById('detail-content').innerHTML = `
            <div style="background:#f4f4f4; padding:20px; margin-bottom:20px; border:1px solid #eee;">
                ${buildProductPicture(product, 'large')}
            </div>
            <h2 style="text-transform:uppercase;">${product.name}</h2>
            <div class="price-tag" style="font-size:1.2rem;">Rs. ${product.price.toLocaleString()}</div>
            <p style="font-size:0.85rem; color:#666; margin:20px 0;">Premium handcrafted furniture from the heart of Gujrat. Designed for durability and elegance.</p>
            <button class="primary-btn" onclick="addToCart(${product.id})">ADD TO CART</button>
            <button class="secondary-btn" onclick="goBack()">BACK</button>
        `;
        showPage('details');
    }

    // Adds a product to the cart, then suggests similar items.
    function addToCart(productId) {
        const product = products.find(item => item.id === productId);
        cart.push(product);
        updateCartDisplay();

        const similarItems = products.filter(item => item.category === product.category && item.id !== product.id).slice(0, 4);
        document.getElementById('suggest-grid').innerHTML = similarItems.map(item => `
            <div class="card" style="min-height:150px; padding:12px;">
                ${buildProductPicture(item, 'small')}
                <div style="font-size:0.6rem; text-transform:uppercase; margin-bottom:5px;">${item.name}</div>
                <div class="price-tag" style="font-size:0.7rem; margin-bottom:10px;">Rs.${item.price.toLocaleString()}</div>
                <button class="secondary-btn" style="padding:8px; font-size:0.6rem; margin-top:auto;" onclick="addExtraItem(${item.id}, this)">+ ADD ALSO</button>
            </div>`).join('');

        showPage('suggestions');
    }

    // Adds one of the suggested items to the cart without leaving the page.
    function addExtraItem(productId, buttonEl) {
        const product = products.find(item => item.id === productId);
        cart.push(product);
        updateCartDisplay();
        buttonEl.innerText = "ADDED ✅";
        buttonEl.style.background = "#d4edda";
    }

    // Empties the cart after the shopper confirms.
    function clearCart() {
        if (confirm("Are you sure you want to empty your cart?")) {
            cart = [];
            updateCartDisplay();
            showPage('home');
        }
    }

    // Updates the cart total shown at the top of the page and on checkout.
    function updateCartDisplay() {
        const total = cart.reduce((sum, product) => sum + product.price, 0);
        document.getElementById('cart-text').innerText = `CART: ${cart.length} ITEMS | TOTAL: RS. ${total.toLocaleString()}`;
        document.getElementById('final-summary').innerHTML = `<strong>Items in Cart:</strong> ${cart.length} <br> <strong>Grand Total:</strong> Rs. ${total.toLocaleString()}`;
    }

    // Opens or closes the side menu.
    function toggleSideMenu() {
        document.getElementById('sidebar').classList.toggle('active');
    }

    // Switches to a new page and remembers the page you're leaving,
    // so the Back button can return you to it later.
    function showPage(pageId) {
        pageHistory.push(currentPage);
        currentPage = pageId;
        document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        document.getElementById('sidebar').classList.remove('active');
        window.scrollTo(0, 0);
    }

    // Returns to whichever page the shopper was on before this one.
    function goBack() {
        const previousPage = pageHistory.pop() || 'home';
        currentPage = previousPage;
        document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
        document.getElementById(previousPage).classList.add('active');
        window.scrollTo(0, 0);
    }

    // Shows only the products in one category (or all of them).
    function filterByCategory(category) {
        if (category === 'All') {
            displayProducts(products);
        } else {
            displayProducts(products.filter(product => product.category === category));
        }
        showPage('home');
    }

    // Hides the welcome/splash screen so the shopper can start browsing.
    function closeWelcomeScreen() {
        document.getElementById('splash').classList.add('hide');
    }

    displayProducts();
</script>
</body>
</html>
